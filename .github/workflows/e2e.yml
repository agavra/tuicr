# End-to-end suite (see e2e/README.md): drives the real binary in tmux against fake forges.
# Needs no secrets, display server or forge access.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JJ_VERSION: 0.47.0

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the installer scenario reads install.sh from the site branch
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-no-lto
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux git mercurial locales
          sudo locale-gen en_US.UTF-8
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux mercurial
      - name: Cache Jujutsu (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tuicr-ci-jj
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ env.JJ_VERSION }}
      - name: Jujutsu
        # Linux: the musl release binary panics on startup in some environments (pest stack check), so build the gnu one.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            jj_root="$HOME/.cache/tuicr-ci-jj"
            if [ ! -x "$jj_root/bin/jj" ]; then
              cargo install --locked --root "$jj_root" jj-cli --version "$JJ_VERSION"
            fi
            echo "E2E_JJ_DIR=$jj_root/bin" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/jj"
            case "$(uname -m)" in arm64) t=aarch64-apple-darwin ;; *) t=x86_64-apple-darwin ;; esac
            curl -fsSL "https://github.com/jj-vcs/jj/releases/download/v$JJ_VERSION/jj-v$JJ_VERSION-$t.tar.gz" | tar -xz -C "$RUNNER_TEMP/jj"
            echo "E2E_JJ_DIR=$RUNNER_TEMP/jj" >> "$GITHUB_ENV"
          fi
      - name: Versions
        run: |
          tmux -V
          hg --version | head -1
          "$E2E_JJ_DIR/jj" --version
          git fetch --no-tags origin site:refs/remotes/origin/site || true
      - name: Build tuicr
        # Skip fat LTO / codegen-units=1 here; Static Linux binary in ci.yml exercises full release LTO.
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --locked --release
      - name: Harness self-test
        run: uv run --python 3.12 e2e/selftest/run.py
      - name: E2E
        env:
          TUICR_BIN: target/release/tuicr
          E2E_ROOT: ${{ runner.temp }}/tuicr-e2e
          E2E_REQUIRE_HG: "1"
          E2E_REQUIRE_JJ: "1"
          E2E_REQUIRE_SKIPS_ZERO: "1"
        run: uv run --python 3.12 e2e/run.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/tuicr-e2e/out
