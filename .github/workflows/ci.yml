name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUFF_VERSION: 0.15.16 # Python lint/format for the e2e suite and scripts (e2e/pyproject.toml)
  TY_VERSION: 0.0.44 # Python type check (e2e/pyproject.toml)

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Python format (ruff)
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check --config e2e/pyproject.toml e2e scripts/demo

  clippy:
    name: Clippy
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Python lint (ruff)
        run: uvx ruff@${{ env.RUFF_VERSION }} check --config e2e/pyproject.toml e2e scripts/demo
      - name: Python types (ty)
        working-directory: e2e # ty reads [tool.ty] from its cwd
        run: uvx ty@${{ env.TY_VERSION }} check . ../scripts/demo

  static-linux:
    name: Static Linux binary
    if: github.event_name == 'pull_request'
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
      - name: Build static binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify static binary
        run: |
          binary=target/x86_64-unknown-linux-musl/release/tuicr
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$("$binary" --version)" = "tuicr $version"
          if readelf -lW "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            echo "Linux release binary contains a dynamic interpreter" >&2
            readelf -lW "$binary" >&2
            exit 1
          fi

  test:
    name: Test
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mercurial (if missing)
        run: command -v hg || (sudo apt-get update && sudo apt-get install -y mercurial)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Jujutsu (if missing)
        run: command -v jj || cargo binstall --strategies crate-meta-data jj-cli --no-confirm
      - run: cargo test
