# Config for the repo's Python only (the e2e suite, its fake forges, scripts/demo); not a package.
# A standalone file under e2e/ keeps the Rust root free of Python packaging metadata. Ruff does not discover it
# for scripts/demo and ty only from its cwd, so always run them like this (see CONTRIBUTING.md#python-checks):
#   uvx ruff@0.15.16 format --check --config e2e/pyproject.toml e2e e2e/bin/* scripts/demo
#   uvx ruff@0.15.16 check --config e2e/pyproject.toml e2e e2e/bin/* scripts/demo
#   (cd e2e && uvx ty@0.0.44 check . bin/* ../scripts/demo)   # ty reads [tool.ty] from the directory it runs in
# (e2e/bin/* are the extensionless fake-CLI shims: tools skip them unless named, hence the explicit glob)
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN"]
ignore = [
  # Scenario/test code opens long-lived handles (pipes, logs) whose lifetime spans several calls.
  "SIM115",
  # Scenario helpers forward **kwargs to Scenario.start/Tui.start unchanged; the forwarded keys are the callee's.
  "ANN401",
]

[tool.ty.environment]
python-version = "3.11"
root = ["lib", "."]

# Harness defaults, read by e2e/run.py (environment variables still override: E2E_SCENARIO_TIMEOUT, E2E_SOCKET,
# E2E_SETTLE_QUIET). Needs Python >= 3.11 (tomllib); run it with `uv run --python 3.12 e2e/run.py`.
[tool.tuicr-e2e]
scenario_timeout = 120   # seconds before a scenario's process tree is killed (FAIL, rc 124)
socket_prefix = "tuicr-e2e"   # tmux socket name is <prefix>-<runner pid>
settle_quiet = 0.25   # default quiet period of Tui.settle()
